<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Voluntariado</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-card h2 {
            margin-bottom: 24px;
            color: #333333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666666;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #0066cc;
        }

        .btn-enviar {
            width: 100%;
            padding: 12px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-enviar:hover {
            background-color: #0052a3;
        }

        .mensagem {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .erro { color: #cc0000; }
        .sucesso { color: #008000; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Acesso ao Sistema</h2>
    
    <form id="formLogin">
        <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="Apenas números (ex: 12345678901)" required maxlength="11">
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Sua senha" required>
        </div>

        <div class="form-group">
            <label for="tipoUsuario">Entrar como</label>
            <select id="tipoUsuario" required>
                <option value="voluntario">Voluntário</option>
                <option value="gerente">Gerente</option>
            </select>
        </div>

        <button type="submit" class="btn-enviar">Entrar</button>
    </form>

    <div id="feedback" class="mensagem"></div>
</div>

<script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();

        const cpf = document.getElementById('cpf').value;
        const senha = document.getElementById('senha').value;
        const tipoUsuario = document.getElementById('tipoUsuario').value; // 'voluntario' ou 'gerente'
        const feedback = document.getElementById('feedback');

        feedback.className = "mensagem";
        feedback.innerText = "Verificando...";

        // Monta a string no formato x-www-form-urlencoded exigido pelo backend Java
        const dadosFormulario = `cpf=${encodeURIComponent(cpf)}&senha=${encodeURIComponent(senha)}`;

        try {
            // Define dinamicamente a URL com base na seleção do usuário
            const url = `http://127.0.0.1:8080/api/login/${tipoUsuario}`;

            const resposta = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: dadosFormulario
            });

            const resultado = await resposta.json();

            if (resposta.status === 200 && resultado.status === 'sucesso') {
                feedback.className = "mensagem sucesso";
                feedback.innerText = "Login autorizado! Redirecionando...";

                // Aguarda 1 segundo para o usuário ver a mensagem e redireciona
                setTimeout(() => {
                    // Direciona para voluntario.html ou gerente.html passando o ID do banco via URL
                    window.location.href = `${tipoUsuario}.html?id=${resultado.id}`;
                }, 1000);

            } else {
                feedback.className = "mensagem erro";
                feedback.innerText = resultado.mensagem || "CPF ou senha incorretos.";
            }

        } catch (erro) {
            console.error("Erro na requisição:", erro);
            feedback.className = "mensagem erro";
            feedback.innerText = "Não foi possível conectar ao servidor.";
        }
    });
</script>

</body>
</html>
